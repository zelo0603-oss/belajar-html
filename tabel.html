<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 200px);
            gap: 35px 55px;
            align-items: start;
        }

        table {
            width: 200px;
            height: 200px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 2px solid #333;
            text-align: center;
            vertical-align: middle;
            font-size: 28px;
            height: 80px;
        }

        .tabel2 td,
        .tabel3 td,
        .tabel4 td,
        .tabel5 td {
            height: auto;
        }

        .tabel2,
        .tabel3,
        .tabel4,
        .tabel5 {
            height: 200px;
        }
    </style>
</head>
<body>
    <a href="index1.html" style="text-decoration: none;">←</a>
    <h3>Contoh tabel Dengan Gabungan (Colspan dan Rowspan)</h3>
<div class="container">

    <table class="tabel1">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td>4</td>
            <td>5</td>
            <td>6</td>
        </tr>
        <tr>
            <td>7</td>
            <td>8</td>
            <td>9</td>
        </tr>
    </table>

    <table class="tabel2">
        <tr>
            <td colspan="1">1</td>
            <td colspan="2">2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td>6</td>
            <td>7</td>
            <td>8</td>
        </tr>
    </table>

    <table class="tabel3">
        <tr>
            <td>1</td>
            <td>2</td>
            <td>3</td>
        </tr>
        <tr>
            <td colspan="3">4</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
    </table>

    <table class="tabel4">
        <tr>
            <td rowspan="1">1</td>
            <td colspan="2">2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>4</td>
            <td>5</td>
        </tr>
        <tr>
            <td colspan="2">6</td>
            <td>7</td>
        </tr>
    </table>

    <table class="tabel5">
        <tr>
            <td rowspan="2">1</td>
            <td>2</td>
            <td rowspan="2">4</td>
        </tr>
        <tr>
            <td>3</td>
        </tr>
        <tr>
            <td>5</td>
            <td>6</td>
            <td>7</td>
        </tr>
    </table>

</div>

</body>
</html>
